name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as a zip
        run: |
          if [ ! -f package.json ]; then
            zipfile=$(ls *.zip | head -n1)
            echo "Extracting $zipfile"
            unzip -q -o "$zipfile"
            if [ ! -f package.json ]; then
              dir=$(find . -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -n1 | xargs dirname)
              cp -r "$dir"/. .
            fi
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          npm install --save @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest @capacitor/assets@latest

      - name: Build web app
        run: npm run build

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          npx capacitor-assets generate --android || echo "skipped icon generation"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matheluha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
